services:
  - type: web
    name: geoclass-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN_REGEX
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: GEE_SERVICE_ACCOUNT
        sync: false
      - key: GEE_SERVICE_ACCOUNT_JSON_B64
        sync: false
